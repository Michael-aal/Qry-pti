name: QRY-PTI Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Align Expo dependencies
        run: |
          npx expo install --fix
          npx expo install --check

      - name: Setup Expo/EAS
        run: npm install --global eas-cli

      - name: Validate Expo configuration
        run: |
          echo "--- eas.json ---"
          cat eas.json
          echo "--- Expo config ---"
          npx expo config --json --type public

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "Missing GitHub secret EAS_PROJECT_ID."
            echo "Create/link the QRY-PTI project in Expo first, then add its project ID as EAS_PROJECT_ID."
            exit 1
          fi
          eas init --id "$EAS_PROJECT_ID" --force --non-interactive
          eas build --platform android --profile preview --non-interactive

      - name: Build instructions
        run: echo "EAS submitted the APK build. Download the generated artifact from the Expo build page."
